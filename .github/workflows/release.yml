name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app's version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Info.plist says $version, the tag is $GITHUB_REF_NAME"; exit 1; }
      - run: scripts/task check
      - run: scripts/task package
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Resources/Info.plist)"
          # The notes are this version's CHANGELOG section, the same text the site shows.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## / { exit } on && /^\[/ { exit } on { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$name $version" --notes-file notes.md dist/*

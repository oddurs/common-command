name: Feature request
description: Suggest something to search, a key, or a change to how results rank.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Common Command doesn't support?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
      description: Common Command uses only public APIs and asks for no permissions; say if your idea would need either.
